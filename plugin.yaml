name: dashboard-auth-feishu
version: 1.0.1
manifest_version: 2
description: >-
  Sign in to the Hermes web dashboard with Feishu or Lark. Only an explicit
  tenant + open_id allow-list is admitted, and every admitted identity gets
  full dashboard access. Sends the app credentials only to Feishu/Lark and
  keeps session metadata (tenant, open_id, display name) in a local SQLite
  file; upstream tokens are never stored.
author: xielevi
license: MIT
homepage: https://github.com/xielevi/hermes-dashboard-auth-feishu
tags: [dashboard, authentication, oauth, feishu, lark]
kind: backend
requires_hermes: ">=0.21.5"
python_dependencies:
  - "httpx>=0.27,<1"
provides_tools: []
provides_hooks: []
config_schema:
  app_id:
    type: str
    description: Feishu/Lark app ID (cli_...). Not a secret.
  tenant_key:
    type: str
    description: Tenant whose members may sign in.
  owner_open_ids:
    type: list
    description: open_ids allowed to sign in. open_ids are per app, so use IDs issued to this app.
  public_url:
    type: str
    description: Public dashboard origin. Defaults to the host's dashboard public URL.
  domain:
    type: str
    default: feishu
    description: "feishu (China) or lark (international)."
# Secrets are environment-only. There is no requires_env gate because either
# HERMES_DASHBOARD_FEISHU_APP_SECRET or a reused FEISHU_APP_SECRET is accepted;
# with neither set, register() is a no-op and the host refuses a gated dashboard.
